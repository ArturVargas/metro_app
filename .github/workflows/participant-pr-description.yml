name: Participant PR description

# Separate from the build so editing the description re-runs only this check.
# The checker comes from the default branch, so a PR cannot change the code that judges its own description.
on:
  pull_request:
    branches:
      - dev
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: participant-pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description:
    name: PR description
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted checker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check required template sections
        run: pnpm --filter @metro/community pr:check-body
